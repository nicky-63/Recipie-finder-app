<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder - Cooking Matters Style</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="hero-section text-white text-center py-5">
    <div class="container py-3">
      <h1 class="display-4 fw-bold mb-2"><i class="fa-solid fa-utensils me-2"></i>Recipe Finder</h1>
      <p class="lead mb-0">Discover healthy, delicious recipes with quick times and simple ingredients.</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container my-4">
    <!-- Search Bar & Filters -->
    <div class="card shadow-sm border-0 mb-4 p-3 rounded-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Search by recipe name or ingredient...">
          </div>
        </div>
        <div class="col-md-4">
          <button id="reset-btn" class="btn btn-outline-secondary w-100"><i class="fa-solid fa-rotate-right me-1"></i> Reset Filters</button>
        </div>
      </div>

      <!-- Filter Pills -->
      <div class="d-flex flex-wrap gap-2 mt-3" id="category-pills">
        <button class="btn btn-sm pill-btn active" data-category="All">All Recipes</button>
        <button class="btn btn-sm pill-btn" data-category="Quick & Easy">⏱️ Under 30 Mins</button>
        <button class="btn btn-sm pill-btn" data-category="Breakfast">🍳 Breakfast</button>
        <button class="btn btn-sm pill-btn" data-category="Dinner">🍝 Dinner</button>
        <button class="btn btn-sm pill-btn" data-category="Healthy">🥗 Healthy</button>
      </div>
    </div>

    <!-- Recipe Grid -->
    <div id="recipe-grid" class="row g-4"></div>
  </main>

  <!-- Recipe Detail Modal -->
  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 overflow-hidden">
        <div class="modal-header border-0 bg-danger text-white">
          <h5 class="modal-title fw-bold" id="modalTitle">Recipe Title</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="modalBody">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
