<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Gourmet - Recipe Finder</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Dark Header -->
  <header class="hero-section text-center py-5 border-bottom border-success">
    <div class="container py-2">
      <h1 class="display-4 fw-bold text-success mb-2">
        <i class="fa-solid fa-utensils me-2"></i>Global Gourmet
      </h1>
      <p class="text-secondary lead mb-0">Discover recipes around the world with exact calories, prep times, and serving sizes.</p>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container my-4">
    <!-- Controls Section -->
    <div class="card dark-card mb-4 p-3 rounded-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-black border-secondary text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="search-input" class="form-control bg-black text-light border-secondary border-start-0" placeholder="Search recipe, cuisine, or ingredient (e.g. Chicken, Indian, Paneer)...">
          </div>
        </div>
        <div class="col-md-4">
          <button id="reset-btn" class="btn btn-outline-success w-100 fw-semibold"><i class="fa-solid fa-rotate-right me-1"></i> Reset Filters</button>
        </div>
      </div>

      <!-- Cuisine Filter Pills -->
      <div class="d-flex flex-wrap gap-2 mt-3" id="cuisine-pills">
        <button class="btn btn-sm pill-btn active" data-cuisine="All">All Cuisines</button>
        <button class="btn btn-sm pill-btn" data-cuisine="Indian">🇮🇳 Indian</button>
        <button class="btn btn-sm pill-btn" data-cuisine="Italian">🇮🇹 Italian</button>
        <button class="btn btn-sm pill-btn" data-cuisine="Mexican">🇲🇽 Mexican</button>
        <button class="btn btn-sm pill-btn" data-cuisine="Japanese">🇯🇵 Japanese</button>
        <button class="btn btn-sm pill-btn" data-cuisine="Mediterranean">🇬🇷 Mediterranean</button>
        <button class="btn btn-sm pill-btn" data-cuisine="American">🇺🇸 American</button>
      </div>
    </div>

    <!-- Recipe Grid -->
    <div id="recipe-grid" class="row g-4"></div>
  </main>

  <!-- Recipe Detail Modal -->
  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content dark-card text-light border border-success rounded-4 overflow-hidden">
        <div class="modal-header border-bottom border-secondary bg-black">
          <h5 class="modal-title fw-bold text-success" id="modalTitle">Recipe Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="modalBody">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
